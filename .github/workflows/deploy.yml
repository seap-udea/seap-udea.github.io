name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows running it manually from GitHub

permissions:
  contents: read
  pages:    write
  id-token: write

# Only one deploy at a time; do not cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/lighting-black-holes/package-lock.json
            apps/cloud_academy/package-lock.json

      - name: Build Lighting Black Holes app
        working-directory: apps/lighting-black-holes
        run: |
          npm ci
          npm run build

      - name: Build Cloud Academy app
        working-directory: apps/cloud_academy
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # Resolve remote book tip SHAs for a stable cache key (API only — no clone)
      - name: Book cache key
        id: books
        run: |
          sha="$(gh api repos/seap-udea/Relatividad-Zuluaga --jq .default_branch \
            | xargs -I{} gh api repos/seap-udea/Relatividad-Zuluaga/commits/{} --jq .sha)"
          echo "key=$sha" >> "$GITHUB_OUTPUT"
          echo "Relatividad-Zuluaga tip: $sha"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore books cache
        uses: actions/cache@v4
        with:
          path: .cache/books
          key: books-${{ steps.books.outputs.key }}
          restore-keys: |
            books-

      # Assemble only the files that should be public
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp stats.html _site/
          cp repos.json _site/
          cp papers.json _site/
          cp -r css _site/css
          cp -r js _site/js
          cp -r assets _site/assets
          cp -r gallery _site/gallery
          cp -r analytics _site/analytics

          # Next.js static apps
          mkdir -p _site/apps
          cp -r apps/lighting-black-holes/out _site/apps/lighting-black-holes
          cp -r apps/cloud_academy/out _site/apps/cloud_academy

          # Books: prefer vendored ./books/, else cache/.cache (clone only on miss)
          ./bin/sync_books.sh _site

          # Prevent GitHub from processing with Jekyll
          touch _site/.nojekyll

          echo "── Artifact contents (sample) ──"
          find _site -type f | head -n 200
          echo "…"
          test -f _site/books/Relatividad-Zuluaga/index.html && echo "✓ books/Relatividad-Zuluaga/index.html"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 2. DEPLOY ─────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
