name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows running it manually from GitHub

permissions:
  contents: read
  pages:    write
  id-token: write

# Only one deploy at a time; do not cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/lighting-black-holes/package-lock.json

      - name: Build Lighting Black Holes app
        working-directory: apps/lighting-black-holes
        run: |
          npm ci
          npm run build

      # Assemble only the files that should be public
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp repos.json _site/
          cp papers.json _site/
          cp -r css _site/css
          cp -r js _site/js
          cp -r assets _site/assets

          # Next.js static apps
          mkdir -p _site/apps
          cp -r apps/lighting-black-holes/out _site/apps/lighting-black-holes

          # Prevent GitHub from processing with Jekyll
          touch _site/.nojekyll

          echo "── Artifact contents ──"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 2. DEPLOY ─────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
