name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows running it manually from GitHub

permissions:
  contents: read
  pages:    write
  id-token: write

# Only one deploy at a time; do not cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assemble only the files that should be public
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r css _site/css
          cp -r js _site/js

          # Prevent GitHub from processing with Jekyll
          touch _site/.nojekyll

          echo "── Artifact contents ──"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 2. DEPLOY ─────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
