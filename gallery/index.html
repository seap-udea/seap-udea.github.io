<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Gallapp…</title>
  <link rel="canonical" href="../gallapp/">
  <script>
    (function () {
      var q = window.location.search || "";
      var hash = window.location.hash || "";
      window.location.replace("../gallapp/" + q + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=../gallapp/">
</head>
<body>
  <p>Gallapp moved to <a id="link" href="../gallapp/">/gallapp/</a>.</p>
  <script>
    document.getElementById("link").href = "../gallapp/" + (window.location.search || "") + (window.location.hash || "");
  </script>
</body>
</html>
