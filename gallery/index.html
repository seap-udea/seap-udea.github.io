<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Gallapp…</title>
  <!--
    Legacy /gallery/?repo=… links redirect to /gallapp/ and keep ?query and #hash.
    Example: /gallery/?repo=PRisma&multi=true → /gallapp/?repo=PRisma&multi=true
  -->
  <link rel="canonical" id="canonical" href="/gallapp/">
  <script>
    (function () {
      var target =
        "/gallapp/" +
        (window.location.search || "") +
        (window.location.hash || "");
      var link = document.getElementById("canonical");
      if (link) link.setAttribute("href", target);
      // Immediate client redirect (keeps repo, session, multi, id, …).
      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/gallapp/">
  </noscript>
</head>
<body>
  <p>
    Gallapp moved to
    <a id="link" href="/gallapp/">https://seap-udea.github.io/gallapp/</a>.
  </p>
  <script>
    (function () {
      var target =
        "/gallapp/" +
        (window.location.search || "") +
        (window.location.hash || "");
      var a = document.getElementById("link");
      if (a) {
        a.href = target;
        a.textContent = "https://seap-udea.github.io" + target;
      }
    })();
  </script>
</body>
</html>
